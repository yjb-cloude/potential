<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>测试练习系统 - 登录</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; margin: 40px; }
        .page-header { text-align: center; color: #333; }
        .login-box { width: 320px; margin: 30px auto; padding: 20px;
                     border: 1px solid #ddd; border-radius: 6px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; }
        .form-control { width: 100%; padding: 8px; box-sizing: border-box; }
        .btn { padding: 8px 16px; margin-right: 8px; cursor: pointer; }
        .btn-primary { background: #2d8cf0; color: #fff; border: none; }
        .btn-default { background: #eee; border: 1px solid #ccc; }
        .page-footer { text-align: center; margin-top: 30px; }
        .page-footer a { margin: 0 12px; color: #2d8cf0; text-decoration: none; }
    </style>
</head>
<body>
<div class="page-header">
    <h1>测试练习系统</h1>
    <p>这是给 Selenium 定位练习用的静态页面</p>
</div>

<div class="login-box">
    <form id="login-form">
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="请输入用户名">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="请输入密码">
        </div>
        <div class="form-group">
            <button type="submit" id="login-btn" class="btn btn-primary">登录</button>
            <button type="reset" class="btn btn-default">重置</button>
        </div>
    </form>
</div>

<div class="page-footer">
    <a href="/about">关于我们</a>
    <a href="/contact">联系我们</a>
    <a href="/help">帮助中心</a>
</div>
</body>
</html>
